<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#0e0e12;font-family:"Inter",sans-serif;color:#fff;overscroll-behavior:none;display:flex;justify-content:center}
#app{height:100vh;height:100dvh;width:100%;max-width:430px;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.topbar{padding:10px 14px 6px;flex-shrink:0}
.wnav{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.warr{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.5);font-size:1rem;user-select:none;flex-shrink:0}
.warr:active{background:rgba(255,255,255,.15)}
.wlbl{font-family:"Syne",sans-serif;font-size:.82rem;font-weight:700;color:#f59e0b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{font-size:.68rem;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28);border-radius:8px;color:#f59e0b;padding:4px 8px;cursor:pointer;white-space:nowrap}
.tbtn.hidden{opacity:0;pointer-events:none}
.hrow{display:flex;align-items:center;justify-content:space-between}
.htitle{font-family:"Syne",sans-serif;font-size:1.1rem;font-weight:800;color:#fff}
.sind{font-size:.68rem;transition:color .3s}
.cbanner{margin:0 14px 6px;display:flex;align-items:center;gap:8px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);border-radius:10px;padding:7px 12px;font-size:.76rem;color:#fbbf24;flex-shrink:0}
.cbanner.hidden{display:none}
.cdot{width:6px;height:6px;border-radius:50%;background:#f59e0b;flex-shrink:0;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.dstrip{display:flex;gap:7px;padding:0 14px 8px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dpill{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 11px;border-radius:13px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);cursor:pointer;min-width:48px}
.dpill:active{background:rgba(255,255,255,.1)}
.dpill.active{background:#f59e0b;border-color:#f59e0b}
.dpill.tring{border-color:rgba(245,158,11,.4)}
.dname{font-family:"Syne",sans-serif;font-size:.72rem;font-weight:700;color:rgba(255,255,255,.5)}
.dpill.active .dname{color:#1a1a1a}
.ddots{display:flex;gap:3px;height:5px;align-items:center}
.ddot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.2)}
.dpill.active .ddot{background:rgba(26,26,26,.35)}
.card{flex:1;margin:0 10px 10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:14px;display:flex;flex-direction:column;overflow:hidden}
.ctop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-shrink:0}
.dfull{font-family:"Syne",sans-serif;font-size:1.1rem;font-weight:700;color:#fff}
.ctopbtns{display:flex;gap:6px;align-items:center}
.mgmt-btn{font-size:.7rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:rgba(255,255,255,.5);padding:4px 8px;cursor:pointer}
.cbadge{font-size:.7rem;color:rgba(255,255,255,.35);background:rgba(255,255,255,.06);padding:3px 9px;border-radius:20px}
.tabs{display:flex;background:rgba(255,255,255,.05);border-radius:11px;padding:3px;margin-bottom:10px;flex-shrink:0}
.tab{flex:1;padding:8px 0;border:none;background:transparent;border-radius:9px;font-family:"Syne",sans-serif;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.tab.pa{background:#818cf8;color:#fff}
.tab.wa{background:#f59e0b;color:#1a1a1a}
.tcnt{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:.62rem;background:rgba(255,255,255,.12)}
.tab.pa .tcnt{background:rgba(255,255,255,.25)}
.tab.wa .tcnt{background:rgba(26,26,26,.2)}
.inrow{display:flex;gap:7px;margin-bottom:8px;flex-shrink:0}
.inp{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:11px 13px;color:#fff;font-family:"Inter",sans-serif;font-size:.9rem;outline:none}
.inp::placeholder{color:rgba(255,255,255,.25)}
.inp:focus{border-color:rgba(129,140,248,.5);background:rgba(255,255,255,.09)}
.inp.w:focus{border-color:rgba(245,158,11,.5)}
.abtn{border:none;border-radius:11px;width:42px;height:42px;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.abtn.p{background:#818cf8;color:#fff}
.abtn.w{background:#f59e0b;color:#1a1a1a}
.abtn:active{transform:scale(.93)}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.list::-webkit-scrollbar{width:3px}
.list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:9px 11px;flex-shrink:0;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.item.carried{background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.28)}
.item.pri-red{border-left:3px solid #f87171}
.item.pri-yellow{border-left:3px solid #fbbf24}
.item.pri-green{border-left:3px solid #4ade80}
.irow{display:flex;align-items:flex-start;gap:9px}
.ctag{font-size:.58rem;color:#f59e0b;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.28);border-radius:4px;padding:2px 5px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.chk{width:21px;height:21px;border-radius:7px;border:2px solid rgba(255,255,255,.15);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;font-weight:700;margin-top:1px}
.chk.pc{border-color:#818cf8}
.chk.pc.on{background:#818cf8;border-color:#818cf8;color:#fff}
.chk.wc{border-color:#f59e0b}
.chk.wc.on{background:#f59e0b;border-color:#f59e0b;color:#1a1a1a}
.chk.cc{border-color:rgba(245,158,11,.55)}
.chk.cc.on{background:#f59e0b;border-color:#f59e0b;color:#1a1a1a}
.twrap{flex:1;min-width:0}
.txt{font-size:.86rem;color:rgba(255,255,255,.82);line-height:1.5;word-break:break-word;white-space:pre-wrap;cursor:pointer}
.txt.done{text-decoration:line-through;color:rgba(255,255,255,.3)}
.edit-ta{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(245,158,11,.5);border-radius:8px;color:#fff;font-family:"Inter",sans-serif;font-size:.86rem;outline:none;padding:6px 8px;resize:none;line-height:1.5;min-height:50px}
.ibtns{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.ibtn2{background:none;border:none;color:rgba(255,255,255,.15);font-size:.85rem;cursor:pointer;padding:3px;line-height:1}
.ibtn2:active{color:#818cf8}
.del{background:none;border:none;color:rgba(255,255,255,.15);font-size:.85rem;cursor:pointer;padding:3px;line-height:1}
.del:active{color:#f87171}
.pri-btn{background:none;border:none;font-size:.8rem;cursor:pointer;padding:3px;line-height:1}
.pri-picker{display:flex;gap:4px;margin-top:5px;padding-left:30px;flex-wrap:wrap}
.pp{border:none;border-radius:6px;padding:3px 7px;font-size:.68rem;cursor:pointer;font-weight:700}
.pp.red{background:rgba(248,113,113,.2);color:#f87171;border:1px solid rgba(248,113,113,.35)}
.pp.yellow{background:rgba(251,191,36,.2);color:#fbbf24;border:1px solid rgba(251,191,36,.35)}
.pp.green{background:rgba(74,222,128,.2);color:#4ade80;border:1px solid rgba(74,222,128,.35)}
.pp.none{background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.1)}
.subtasks{margin-top:7px;display:flex;flex-direction:column;gap:4px;padding-left:30px}
.sitem{display:flex;align-items:center;gap:7px}
.schk{width:15px;height:15px;border-radius:4px;border:1.5px solid rgba(255,255,255,.2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;font-weight:700}
.schk.on{background:rgba(129,140,248,.7);border-color:#818cf8;color:#fff}
.stxt{font-size:.8rem;color:rgba(255,255,255,.6);flex:1;word-break:break-word;cursor:pointer;line-height:1.4}
.stxt.done{text-decoration:line-through;color:rgba(255,255,255,.25)}
.sedit{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(245,158,11,.5);border-radius:7px;color:#fff;font-family:"Inter",sans-serif;font-size:.8rem;outline:none;padding:4px 7px;resize:none;min-height:36px;line-height:1.4}
.sdel{background:none;border:none;color:rgba(255,255,255,.15);font-size:.78rem;cursor:pointer;padding:3px}
.sdel:active{color:#f87171}
.asub{margin-top:5px;margin-left:30px;background:none;border:1px dashed rgba(255,255,255,.12);border-radius:7px;color:rgba(255,255,255,.3);font-size:.72rem;padding:4px 9px;cursor:pointer}
.asub:active{border-color:rgba(129,140,248,.4);color:#818cf8}
.foot{margin-top:8px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.pbar-w{flex:1;height:3px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.pbar{height:100%;border-radius:4px;transition:width .4s ease}
.pbar.p{background:#818cf8}
.pbar.w{background:#f59e0b}
.clr{font-size:.7rem;background:none;border:none;color:rgba(248,113,113,.5);cursor:pointer;padding:3px 6px;border-radius:6px}
.clr:active{color:#f87171}
.empty{text-align:center;padding:24px 0;font-size:.83rem;color:rgba(255,255,255,.18);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ei{font-size:2rem;margin-bottom:8px;opacity:.35}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-bg.hidden{display:none}
.modal{background:#1a1a2e;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:430px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0))}
.modal h3{font-family:"Syne",sans-serif;font-size:1rem;font-weight:700;margin-bottom:14px;color:#fff}
.modal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.mday{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:9px;padding:7px 3px;text-align:center;cursor:pointer;font-size:.7rem;color:rgba(255,255,255,.6);font-family:"Syne",sans-serif;font-weight:700}
.mday.sel{background:#818cf8;border-color:#818cf8;color:#fff}
.mday:active{background:rgba(129,140,248,.4)}
.modal-btns{display:flex;gap:8px}
.mbtn{flex:1;padding:11px;border:none;border-radius:11px;font-family:"Syne",sans-serif;font-weight:700;font-size:.85rem;cursor:pointer}
.mbtn.confirm{background:#818cf8;color:#fff}
.mbtn.cancel{background:rgba(255,255,255,.07);color:rgba(255,255,255,.5)}
.modal-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.mopt{padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:rgba(255,255,255,.04);cursor:pointer;font-size:.85rem;color:rgba(255,255,255,.7)}
.mopt:active{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:#f87171}
#ibanner{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#1a1a2e,#16213e);border-top:1px solid rgba(245,158,11,.3);padding:14px 18px;display:flex;align-items:center;gap:10px;z-index:100;padding-bottom:calc(14px + env(safe-area-inset-bottom,0))}
#ibanner.hidden{display:none}
.itxt{flex:1;font-size:.8rem;color:rgba(255,255,255,.7);line-height:1.4}
.itxt strong{color:#f59e0b;display:block;font-size:.85rem;margin-bottom:1px}
.iibtn{background:#f59e0b;color:#1a1a1a;border:none;border-radius:9px;padding:9px 14px;font-family:"Syne",sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;white-space:nowrap}
.xbtn{background:none;border:none;color:rgba(255,255,255,.3);font-size:1rem;cursor:pointer;padding:4px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="wnav">
      <div class="warr" id="pw">&#8249;</div>
      <div class="wlbl" id="wl"></div>
      <button class="tbtn hidden" id="tb">Bugun</button>
      <div class="warr" id="nw">&#8250;</div>
    </div>
    <div class="hrow">
      <div class="htitle">K-CheckList</div>
      <div class="sind" id="si" style="color:rgba(255,255,255,.15)">&#9702; Kayitli</div>
    </div>
  </div>
  <div class="cbanner hidden" id="cb"><div class="cdot"></div><span id="ct"></span></div>
  <div class="dstrip" id="ds"></div>
  <div class="card">
    <div class="ctop">
      <div class="dfull" id="df"></div>
      <div class="ctopbtns">
        <button class="mgmt-btn" onclick="showMgmt()">&#9881; Yonet</button>
        <div class="cbadge" id="bdg"></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab pa" id="tP" onclick="setTab('P')">&#128100; Personal <span class="tcnt" id="cP">0</span></button>
      <button class="tab" id="tI" onclick="setTab('I')">&#128188; Is <span class="tcnt" id="cI">0</span></button>
    </div>
    <div class="inrow">
      <input class="inp" id="ti" placeholder="Gorev ekle..."/>
      <button class="abtn p" id="ab" onclick="addTodo()">+</button>
    </div>
    <div class="list" id="list"></div>
    <div class="foot" id="foot" style="display:none">
      <div class="pbar-w"><div class="pbar p" id="pb" style="width:0%"></div></div>
      <button class="clr" id="cb2" style="display:none" onclick="clearDone()">Tamamlananlari sil</button>
    </div>
  </div>
</div>
<div class="modal-bg hidden" id="moveModal">
  <div class="modal">
    <h3>Gorevi hangi gune tasiyalim?</h3>
    <div class="modal-days" id="moveDays"></div>
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <button class="mbtn confirm" onclick="doMove(false)">Tasi</button>
      <button class="mbtn confirm" style="background:#4ade80;color:#1a1a1a" onclick="doMove(true)">Kopyala</button>
    </div>
    <button class="mbtn cancel" onclick="closeModal('moveModal')">Iptal</button>
  </div>
</div>
<div class="modal-bg hidden" id="mgmtModal">
  <div class="modal">
    <h3>Gorev Yonetimi</h3>
    <div class="modal-opts">
      <div class="mopt" onclick="deleteDayTodos()">&#128465; Bu gunun gorevlerini sil</div>
      <div class="mopt" onclick="showDeleteDays()">&#128465; Secili gunlerin gorevlerini sil</div>
      <div class="mopt" onclick="deleteAllTodos()">&#128465; Bu haftanin tum gorevlerini sil</div>
    </div>
    <button class="mbtn cancel" onclick="closeModal('mgmtModal')">Kapat</button>
  </div>
</div>
<div class="modal-bg hidden" id="delModal">
  <div class="modal">
    <h3>Hangi gunleri silmek istiyorsun?</h3>
    <div class="modal-days" id="delDaysBtns"></div>
    <div class="modal-btns">
      <button class="mbtn confirm" style="background:#f87171" onclick="doDeleteDays()">Sil</button>
      <button class="mbtn cancel" onclick="closeModal('delModal')">Iptal</button>
    </div>
  </div>
</div>
<div id="ibanner" class="hidden">
  <div class="itxt"><strong>&#128241; Ana Ekrana Ekle</strong>Cevrimdisi calisir!</div>
  <button class="iibtn" id="installBtn">Yukle</button>
  <button class="xbtn" onclick="document.getElementById('ibanner').classList.add('hidden')">&#x2715;</button>
</div>
<script>
const DAYS=["Pzt","Sal","Car","Per","Cum","Cmt","Paz"];
const FULL=["Pazartesi","Sali","Carsamba","Persembe","Cuma","Cumartesi","Pazar"];
const SK="kcl-v3";

function isoWeek(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()+3-((x.getDay()+6)%7));const w=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w)/86400000-3+((w.getDay()+6)%7))/7);}
function monday(y,w){const j=new Date(y,0,4);const d=(j.getDay()+6)%7;const m=new Date(j);m.setDate(j.getDate()-d+(w-1)*7);return m;}
function fd(d,y){return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+(y?"."+d.getFullYear():"");}
function wlabel(y,w){const m=monday(y,w);const s=new Date(m);s.setDate(m.getDate()+6);return "W"+w+": "+fd(m)+"-"+fd(s,true);}
function maxW(y){return isoWeek(new Date(y,11,28));}
function wk(y,w){return y+"-W"+w;}
function emptyW(){const d={};DAYS.forEach(day=>{d[day]={P:[],I:[]}});return d;}

const now=new Date();
const tIdx=now.getDay()===0?6:now.getDay()-1;
const cW=isoWeek(now),cY=now.getFullYear();
let S={wn:cW,wy:cY,day:DAYS[tIdx],tab:"P",allW:{}};
S.allW[wk(cY,cW)]=emptyW();
let moveState={id:null,srcDay:null,srcTab:null,targetDay:null};
let delSel=new Set();

function save(){
  try{localStorage.setItem(SK,JSON.stringify(S.allW));}catch(_){}
  ss("saving");setTimeout(()=>ss("saved"),400);
}
function load(){try{const r=localStorage.getItem(SK);if(r)S.allW=JSON.parse(r);}catch(_){}}
function ss(s){
  const e=document.getElementById("si");
  if(s==="saving"){e.style.color="rgba(255,255,255,.3)";e.textContent="Kaydediliyor";}
  else{e.style.color="#4ade80";e.textContent="Kaydedildi";setTimeout(()=>{e.style.color="rgba(255,255,255,.15)";e.textContent="Kayitli";},2000);}
}

function carryDay(y,w,di){
  const k=wk(y,w);
  if(!S.allW[k])S.allW[k]=emptyW();
  let prevDay,prevData;
  if(di===0){
    let pw=w-1,py=y;if(pw<1){py--;pw=maxW(py);}
    prevData=S.allW[wk(py,pw)];prevDay=DAYS[6];
  } else {prevData=S.allW[k];prevDay=DAYS[di-1];}
  if(!prevData)return;
  ["P","I"].forEach(tab=>{
    const existing=new Set((S.allW[k][DAYS[di]][tab]||[]).filter(t=>t.co).map(t=>t.oid||t.id));
    const unf=((prevData[prevDay]&&prevData[prevDay][tab])||[]).filter(t=>!t.done).filter(t=>!existing.has(t.id))
      .map(t=>({...t,co:true,oid:t.id,id:Date.now()+Math.random()}));
    S.allW[k][DAYS[di]][tab]=[...S.allW[k][DAYS[di]][tab],...unf];
  });
}
function ensureW(y,w){
  const k=wk(y,w);if(!S.allW[k])S.allW[k]=emptyW();
  const isCur=w===cW&&y===cY;
  const upTo=isCur?tIdx:6;
  for(let i=1;i<=upTo;i++)carryDay(y,w,i);
  if(isCur&&tIdx===0)carryDay(y,w,0);
}
function wd(){ensureW(S.wy,S.wn);return S.allW[wk(S.wy,S.wn)];}
function todos(){return (wd()[S.day]&&wd()[S.day][S.tab])||[];}
function getTodo(id){const k=wk(S.wy,S.wn);return S.allW[k][S.day][S.tab].find(t=>t.id===id);}

function render(){
  const isC=S.wn===cW&&S.wy===cY;
  document.getElementById("wl").textContent=wlabel(S.wy,S.wn);
  document.getElementById("tb").classList.toggle("hidden",isC);
  const w=wd();const cd=w[S.day];
  const carried=((cd&&cd.P)||[]).filter(t=>t.co).length+((cd&&cd.I)||[]).filter(t=>t.co).length;
  const cbEl=document.getElementById("cb");
  if(carried>0){cbEl.classList.remove("hidden");document.getElementById("ct").textContent="Onceki gunden "+carried+" tamamlanmamis gorev tasindi";}
  else cbEl.classList.add("hidden");

  const ds=document.getElementById("ds");ds.innerHTML="";
  DAYS.forEach((day,i)=>{
    const cnt=(w[day]&&w[day].P?w[day].P.length:0)+(w[day]&&w[day].I?w[day].I.length:0);
    const act=S.day===day,isT=isC&&i===tIdx;
    const p=document.createElement("div");
    p.className="dpill"+(act?" active":"")+(isT&&!act?" tring":"");
    p.innerHTML='<span class="dname">'+day+'</span><div class="ddots">'+Array(Math.min(cnt||1,3)).fill(0).map(()=>'<div class="ddot"'+(cnt===0?' style="opacity:.15"':"")+"></div>").join("")+"</div>";
    p.onclick=()=>{S.day=day;render();};
    ds.appendChild(p);
  });

  document.getElementById("df").textContent=FULL[DAYS.indexOf(S.day)];
  const tds=todos();
  document.getElementById("cP").textContent=((w[S.day]&&w[S.day].P)||[]).length;
  document.getElementById("cI").textContent=((w[S.day]&&w[S.day].I)||[]).length;
  document.getElementById("tP").className="tab"+(S.tab==="P"?" pa":"");
  document.getElementById("tI").className="tab"+(S.tab==="I"?" wa":"");
  const ti=document.getElementById("ti");
  ti.className="inp"+(S.tab==="I"?" w":"");
  ti.placeholder=FULL[DAYS.indexOf(S.day)]+" "+(S.tab==="P"?"kisisel":"is")+" gorevi...";
  document.getElementById("ab").className="abtn"+(S.tab==="P"?" p":" w");
  document.getElementById("bdg").textContent=tds.filter(t=>!t.done).length+" kaldi";

  const list=document.getElementById("list");list.innerHTML="";
  if(tds.length===0){
    const e=document.createElement("div");e.className="empty";
    e.innerHTML='<div class="ei">'+(S.tab==="P"?"🌙":"📋")+"</div><div>Henuz gorev yok</div>";
    list.appendChild(e);
  } else {
    tds.forEach(todo=>{
      const isP=S.tab==="P",isC2=!!todo.co,pri=todo.pri||"none";
      const item=document.createElement("div");
      item.className="item"+(isC2?" carried":"")+(pri!=="none"?" pri-"+pri:"");
      const irow=document.createElement("div");irow.className="irow";
      const chk=document.createElement("div");
      chk.className="chk "+(isC2?"cc":isP?"pc":"wc")+(todo.done?" on":"");
      chk.textContent=todo.done?"✓":"";chk.onclick=()=>toggleTodo(todo.id);
      const tw=document.createElement("div");tw.className="twrap";
      const tx=document.createElement("div");
      tx.className="txt"+(todo.done?" done":"");tx.textContent=todo.text;tx.onclick=()=>startEdit(todo.id,tx);
      tw.appendChild(tx);
      const ibtns=document.createElement("div");ibtns.className="ibtns";
      const priEmoji={none:"⚪",red:"🔴",yellow:"🟡",green:"🟢"};
      const priBtnEl=document.createElement("button");priBtnEl.className="pri-btn";priBtnEl.textContent=priEmoji[pri]||"⚪";priBtnEl.onclick=()=>togglePriPicker(todo.id,item);
      const moveBtn=document.createElement("button");moveBtn.className="ibtn2";moveBtn.textContent="↗";moveBtn.onclick=()=>openMove(todo.id);
      const delBtn=document.createElement("button");delBtn.className="del";delBtn.textContent="✕";delBtn.onclick=()=>deleteTodo(todo.id);
      ibtns.appendChild(priBtnEl);ibtns.appendChild(moveBtn);ibtns.appendChild(delBtn);
      if(isC2){const tag=document.createElement("span");tag.className="ctag";tag.textContent="prev";irow.appendChild(chk);irow.appendChild(tw);irow.appendChild(tag);irow.appendChild(ibtns);}
      else{irow.appendChild(chk);irow.appendChild(tw);irow.appendChild(ibtns);}
      item.appendChild(irow);
      if(todo.subs&&todo.subs.length>0){
        const se=document.createElement("div");se.className="subtasks";
        todo.subs.forEach(sub=>{
          const sr=document.createElement("div");sr.className="sitem";
          const sc=document.createElement("div");sc.className="schk"+(sub.done?" on":"");sc.textContent=sub.done?"✓":"";sc.onclick=()=>toggleSub(todo.id,sub.id);
          const st=document.createElement("span");st.className="stxt"+(sub.done?" done":"");st.textContent=sub.text;st.onclick=()=>editSub(todo.id,sub.id,st);
          const sd=document.createElement("button");sd.className="sdel";sd.textContent="✕";sd.onclick=()=>delSub(todo.id,sub.id);
          sr.appendChild(sc);sr.appendChild(st);sr.appendChild(sd);se.appendChild(sr);
        });
        item.appendChild(se);
      }
      const asub=document.createElement("button");asub.className="asub";asub.textContent="+ Alt gorev";asub.onclick=()=>addSub(todo.id);
      item.appendChild(asub);
      list.appendChild(item);
    });
  }
  const foot=document.getElementById("foot");
  if(tds.length>0){
    foot.style.display="flex";
    const dn=tds.filter(t=>t.done).length;
    document.getElementById("pb").style.width=(dn/tds.length*100)+"%";
    document.getElementById("pb").className="pbar"+(S.tab==="P"?" p":" w");
    document.getElementById("cb2").style.display=tds.some(t=>t.done)?"block":"none";
  } else foot.style.display="none";
}

function startEdit(id,txEl){
  const todo=getTodo(id);if(!todo)return;
  const ta=document.createElement("textarea");ta.className="edit-ta";ta.value=todo.text;
  ta.rows=Math.max(2,todo.text.split("\n").length+1);txEl.replaceWith(ta);ta.focus();
  ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";});
  ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";
  function fin(){const v=ta.value.trim();if(v){todo.text=v;save();}render();}
  ta.onblur=fin;ta.onkeydown=e=>{if(e.key==="Escape"){ta.onblur=null;render();}};
}
function togglePriPicker(id,itemEl){
  const ex=itemEl.querySelector(".pri-picker");if(ex){ex.remove();return;}
  const pp=document.createElement("div");pp.className="pri-picker";
  [["red","🔴 Kritik"],["yellow","🟡 Orta"],["green","🟢 Normal"],["none","⚪ Yok"]].forEach(([val,lbl])=>{
    const b=document.createElement("button");b.className="pp "+val;b.textContent=lbl;
    b.onclick=()=>{const t=getTodo(id);if(t){t.pri=val;save();}render();};
    pp.appendChild(b);
  });
  itemEl.appendChild(pp);
}
function openMove(id){
  moveState={id,srcDay:S.day,srcTab:S.tab,targetDay:null};
  const md=document.getElementById("moveDays");md.innerHTML="";
  DAYS.forEach(day=>{
    const b=document.createElement("div");b.className="mday"+(day===S.day?" sel":"");b.textContent=day;
    b.onclick=()=>{moveState.targetDay=day;md.querySelectorAll(".mday").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");};
    md.appendChild(b);
  });
  document.getElementById("moveModal").classList.remove("hidden");
}
function doMove(copy){
  if(!moveState.targetDay){closeModal("moveModal");return;}
  const k=wk(S.wy,S.wn);
  const srcList=S.allW[k][moveState.srcDay][moveState.srcTab];
  const todo=srcList.find(t=>t.id===moveState.id);if(!todo){closeModal("moveModal");return;}
  const newTodo={...todo,id:Date.now()+Math.random(),co:false};
  S.allW[k][moveState.targetDay][moveState.srcTab].push(newTodo);
  if(!copy)S.allW[k][moveState.srcDay][moveState.srcTab]=srcList.filter(t=>t.id!==todo.id);
  save();closeModal("moveModal");render();
}
function showMgmt(){document.getElementById("mgmtModal").classList.remove("hidden");}
function deleteDayTodos(){const k=wk(S.wy,S.wn);S.allW[k][S.day][S.tab]=[];save();closeModal("mgmtModal");render();}
function showDeleteDays(){
  closeModal("mgmtModal");delSel=new Set();
  const db=document.getElementById("delDaysBtns");db.innerHTML="";
  DAYS.forEach(day=>{
    const b=document.createElement("div");b.className="mday";b.textContent=day;
    b.onclick=()=>{if(delSel.has(day)){delSel.delete(day);b.classList.remove("sel");}else{delSel.add(day);b.classList.add("sel");}};
    db.appendChild(b);
  });
  document.getElementById("delModal").classList.remove("hidden");
}
function doDeleteDays(){const k=wk(S.wy,S.wn);delSel.forEach(day=>{S.allW[k][day][S.tab]=[];});save();closeModal("delModal");render();}
function deleteAllTodos(){const k=wk(S.wy,S.wn);DAYS.forEach(day=>{S.allW[k][day][S.tab]=[];});save();closeModal("mgmtModal");render();}
function closeModal(id){document.getElementById(id).classList.add("hidden");}
function addTodo(){const ti=document.getElementById("ti");const text=ti.value.trim();if(!text)return;const k=wk(S.wy,S.wn);S.allW[k][S.day][S.tab].unshift({id:Date.now(),text,done:false,co:false,subs:[],pri:"none"});ti.value="";save();render();}
function toggleTodo(id){const t=getTodo(id);if(t){t.done=!t.done;save();render();}}
function deleteTodo(id){const k=wk(S.wy,S.wn);S.allW[k][S.day][S.tab]=S.allW[k][S.day][S.tab].filter(t=>t.id!==id);save();render();}
function clearDone(){const k=wk(S.wy,S.wn);S.allW[k][S.day][S.tab]=S.allW[k][S.day][S.tab].filter(t=>!t.done);save();render();}
function setTab(t){S.tab=t;render();}
function addSub(tid){const t=getTodo(tid);if(!t)return;if(!t.subs)t.subs=[];t.subs.push({id:Date.now()+Math.random(),text:"Yeni alt gorev",done:false});save();render();setTimeout(()=>{const els=document.querySelectorAll(".stxt");if(els.length)els[els.length-1].click();},50);}
function toggleSub(tid,sid){const t=getTodo(tid);if(!t||!t.subs)return;const s=t.subs.find(x=>x.id===sid);if(s){s.done=!s.done;save();render();}}
function delSub(tid,sid){const t=getTodo(tid);if(!t)return;t.subs=t.subs.filter(x=>x.id!==sid);save();render();}
function editSub(tid,sid,el){
  const t=getTodo(tid);if(!t)return;const s=t.subs.find(x=>x.id===sid);if(!s)return;
  const ta=document.createElement("textarea");ta.className="sedit";ta.value=s.text;ta.rows=Math.max(2,s.text.split("\n").length+1);el.replaceWith(ta);ta.focus();ta.select();
  ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";});ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";
  function fin(){const v=ta.value.trim();if(v){s.text=v;save();}render();}
  ta.onblur=fin;ta.onkeydown=e=>{if(e.key==="Escape"){ta.onblur=null;render();}};
}
document.getElementById("pw").onclick=()=>{if(S.wn===1){const py=S.wy-1;S.wy=py;S.wn=maxW(py);}else S.wn--;S.day="Pzt";ensureW(S.wy,S.wn);render();};
document.getElementById("nw").onclick=()=>{const mx=maxW(S.wy);if(S.wn===mx){S.wy++;S.wn=1;}else S.wn++;S.day="Pzt";ensureW(S.wy,S.wn);render();};
document.getElementById("tb").onclick=()=>{S.wn=cW;S.wy=cY;S.day=DAYS[tIdx];render();};
document.getElementById("ti").addEventListener("keydown",e=>{if(e.key==="Enter")addTodo();});
